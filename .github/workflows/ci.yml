name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CHRONICLE_EMBEDDING_BACKEND: tfidf

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check chronicle apps tests
      - run: black --check chronicle apps tests
      - run: mypy chronicle apps

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/ --cov-report=xml
      - run: chronicle --version
      - run: chronicle demo --db demo.db
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke test installed wheel outside source tree
        run: |
          python -m venv /tmp/chronicle-smoke
          /tmp/chronicle-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/chronicle-smoke/bin/chronicle --version
          /tmp/chronicle-smoke/bin/chronicle demo --db /tmp/wheel-demo.db
          /tmp/chronicle-smoke/bin/python -c "from apps.api.main import app; from chronicle import __version__; assert app.version == __version__"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - name: Audit runtime dependencies including transitive packages
        run: pip-audit -r requirements.txt
