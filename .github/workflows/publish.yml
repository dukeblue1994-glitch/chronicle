name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release version and changelog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import re
          import tomllib
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Release tag must be vX.Y.Z')
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tree = ast.parse(pathlib.Path('chronicle/__init__.py').read_text())
          runtime = next(ast.literal_eval(node.value) for node in tree.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets))
          assert version == runtime == tag[1:], 'Package, runtime, and tag versions must match'
          assert f'## [{version}]' in pathlib.Path('CHANGELOG.md').read_text(), 'Missing changelog'
          PY

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chronicle-events
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Prepare publishing authentication
        id: credential
        env:
          PYPI_CREDENTIAL: ${{ secrets.PI_PY_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          token = os.environ.get("PYPI_CREDENTIAL", "").strip()
          if re.fullmatch(r"pypi-[A-Za-z0-9_-]+={0,2}", token):
              print(f"::add-mask::{token}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"token={token}\n")
              print("Using the configured PyPI token after whitespace normalization.")
          else:
              print("No valid PyPI token configured; using existing Trusted Publishing.")
          PYTHON
      - name: Publish tested distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ steps.credential.outputs.token }}
          attestations: ${{ steps.credential.outputs.token == '' }}
