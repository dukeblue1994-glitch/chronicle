name: Publish to PyPI (Token fallback)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected vX.Y.Z'
          assert tag == f'v{version}', 'Version mismatch'
          assert f'## [{version}]' in pathlib.Path('CHANGELOG.md').read_text(), 'Missing changelog'
          PY
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Prepare publishing authentication
        id: credential
        env:
          PYPI_CREDENTIAL: ${{ secrets.PI_PY_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          token = os.environ.get("PYPI_CREDENTIAL", "").strip()
          if re.fullmatch(r"pypi-[A-Za-z0-9_-]+={0,2}", token):
              print(f"::add-mask::{token}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"token={token}\n")
              print("Using the configured PyPI token after whitespace normalization.")
          else:
              print("No valid PyPI token configured; using existing Trusted Publishing.")
          PYTHON
      - name: Publish tested distributions using existing token
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ steps.credential.outputs.token }}
          attestations: ${{ steps.credential.outputs.token == '' }}
