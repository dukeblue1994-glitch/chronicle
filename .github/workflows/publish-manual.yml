name: Publish to PyPI (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        default: "0.1.0"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate version and changelog
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = os.environ["INPUT_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Version must look like X.Y.Z, got: {version}")

          pyproject_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if pyproject_version != version:
              raise SystemExit(
                  f"Input version {version} does not match pyproject version {pyproject_version}"
              )

          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md is missing section for version {version}")

          print("Manual publish metadata validated")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
