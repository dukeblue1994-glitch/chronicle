[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-events"
version = "0.2.0"
description = "Turn news streams into searchable events and source-linked timelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Nick Anderson", email = "nick@candience.com"}
]
keywords = [
    "machine-learning",
    "nlp",
    "clustering",
    "event-detection",
    "news-aggregation",
    "hdbscan",
    "semantic-search",
    "text-mining"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.6,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "readability-lxml>=0.8.1,<1.0.0",
    "lxml>=6.1.0,<7.0.0",
    "numpy>=1.24.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "hdbscan>=0.8.38,<1.0.0",
    "datasketch>=1.6.5,<2.0.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.1.0,<7.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black==26.5.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-beautifulsoup4>=4.12.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/dukeblue1994-glitch/chronicle"
Repository = "https://github.com/dukeblue1994-glitch/chronicle"
Issues = "https://github.com/dukeblue1994-glitch/chronicle/issues"

[project.scripts]
chronicle = "chronicle.cli:main"
chronicle-collector = "apps.collector.run:main"
chronicle-api = "apps.api.main:main"
chronicle-cluster = "chronicle.cluster.pipeline:main"
chronicle-scheduler = "apps.scheduler.run:main"

[tool.setuptools.packages.find]
include = ["chronicle*", "apps*"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=chronicle",
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "hdbscan.*",
    "datasketch.*",
    "numpy.*",
    "sklearn.*",
    "sentence_transformers.*",
    "readability.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["chronicle", "apps"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
