services:
  api:
    build: .
    command: chronicle-api
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["chronicle-data:/app/data"]
  collector:
    build: .
    command: chronicle-collector
    volumes: ["chronicle-data:/app/data"]
  scheduler:
    build: .
    command: chronicle-scheduler
    volumes: ["chronicle-data:/app/data"]
volumes:
  chronicle-data:
